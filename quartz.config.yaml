# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Entropy
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: ja-JP
  baseUrl: entropy-notes.dev
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: M PLUS 1 Code
      body: IBM Plex Sans JP
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#f3f5ef"
        lightgray: "#d9dfd3"
        gray: "#7d8c80"
        darkgray: "#27332b"
        dark: "#0f1a13"
        secondary: "#0a7a3d"
        tertiary: "#b05a00"
        highlight: rgba(10, 122, 61, 0.08)
        textHighlight: "#ffb00055"
      darkMode:
        light: "#0a0e0b"
        lightgray: "#1d2b21"
        gray: "#55785e"
        darkgray: "#b9d6c0"
        dark: "#e4ffe9"
        secondary: "#4af58a"
        tertiary: "#ffb000"
        highlight: rgba(74, 245, 138, 0.08)
        textHighlight: "#ffb00044"
  links:
    markdownLinkResolution: shortest
  contentIndex:
    enableSiteMap: true
    enableRSS: true
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: created
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseBlockReferences: true
      enableYouTubeEmbed: true
      enableVideoEmbed: true
    order: 40
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 30
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: default
      mode: both
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/favicon"
    enabled: true
  # 本体の og-image は直接使わず、下の og-image-cache から呼ぶ（有効にすると画像を 2 回作る）
  - source: "@quartz-community/og-image"
    enabled: false
  # 本体の og-image を包み、描く内容が変わったページの OGP 画像だけを作り直す（plugins/og-image-cache）
  - source: ./plugins/og-image-cache
    enabled: true
    options:
      colorScheme: darkMode
  # 配色を Entropy・Catppuccin・Tokyo Night・Gruvbox から選べるようにする（plugins/theme-palette）
  - source: ./plugins/theme-palette
    enabled: true
  # 左のサイドバーの新着とエクスプローラーの境目をドラッグで動かす（plugins/sidebar-resizer）
  - source: ./plugins/sidebar-resizer
    enabled: true
  # トップページの {{page-count}} を、公開されているノートの数に置き換える（plugins/page-count）
  - source: ./plugins/page-count
    enabled: true
  # Cloudflare Pages では CNAME ファイルを使わない
  - source: "@quartz-community/cname"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    options:
      showReadingTime: false
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  # 本家は「作成 Quartz v5.1.0 © 2026」と英語の語順のまま出すので、plugins/site-footer に置き換えた
  - source: "@quartz-community/footer"
    enabled: false
  # ページの下に「© 年 著者 · Created with Quartz」とリンクを出す（plugins/site-footer）
  - source: ./plugins/site-footer
    enabled: true
    options:
      author: radish-miyazaki
      links:
        GitHub: https://github.com/radish-miyazaki/entropy
        RSS: /index.xml
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: true
    options:
      title: 新着
      limit: 5
      linkToMore: false
      showTags: true
      hideTagPages: true
      hideFolderPages: true
    layout:
      position: left
      priority: 25
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
